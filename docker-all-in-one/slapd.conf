include         /etc/ldap/schema/core.schema
include         /etc/ldap/schema/cosine.schema
include         /etc/ldap/schema/inetorgperson.schema
include         /etc/ldap/schema/phone2schema.schema

pidfile         /var/run/slapd/slapd.pid
argsfile        /var/run/slapd/slapd.args

modulepath      /usr/lib/ldap
moduleload      back_mdb
moduleload      sssvlv.so

database        mdb
maxsize         2147483648
suffix          "dc=coreip,dc=local"
rootdn          "cn=admin,dc=coreip,dc=local"
rootpw          {SSHA}s4ZVdymADnGiYGiYjuupJcr8aD+yKBCn
directory       /var/lib/ldap

overlay         sssvlv
sssvlv-max      32
sssvlv-maxkeys  5
sssvlv-maxperconn 16

index           objectClass eq
index           uid eq,sub
index           cn eq,sub
index           sn eq,sub
index           givenName eq,sub
index           employeeNumber eq
index           telephoneNumber eq,sub
index           mobile eq,sub
index           phone2 eq,sub
index           mail eq,sub

database        monitor

